    <h1>Ask Social - Avantages Collaborateurs</h1>

    <h2>Prêts logement</h2>
    <p><strong>Q :</strong> Qui peut bénéficier d’un prêt logement ?</p>
    <p><strong>R :</strong> Tout collaborateur en CDI depuis au moins 6 mois.</p>

    <h2>Mutuelle</h2>
    <p><strong>Q :</strong> Comment ajouter un membre de ma famille ?</p>
    <p><strong>R :</strong> Envoyer le formulaire disponible à l’équipe RH.</p>

    <!-- 🟦 Système des Prêts Solidaires 
Des solutions flexibles pour accompagner chaque étape de votre vie !
👉 Accessible dès 6 mois d’ancienneté (sauf exceptions précisées).
________________________________________
🔹 1. Prêt Personnel Bien-Être
•	Objet : financer projets personnels (santé, voyages, équipements divers).
•	Montant max. : 80 000 DHS
•	Durée max. : 72 mois
•	Avantages : remboursement modulable (pause jusqu’à 3 mois), taux préférentiel fixe.
•	Conditions : justificatif facultatif, accord hiérarchique non requis.
•	Modalités spéciales : remboursement anticipé possible sans pénalité après 12 mois.
•	Banques partenaires : FINMOI, CFT, DMV
________________________________________
🔹 2. Prêt Scolarité & Formation Continue
•	Objet : frais de scolarité enfants ou formation du collaborateur.
•	Montant max. : 20 000 DHS
•	Durée max. : 60 mois
•	Avantages : décaissement en plusieurs tranches selon calendrier scolaire.
•	Conditions : attestation de scolarité ou d’inscription obligatoire.
•	Cumul : peut être contracté en parallèle avec un prêt logement ou personnel.
•	Banques partenaires : FINMOI, CFT
________________________________________
🔹 3. Prêt Mobilité Verte
•	Objet : acquisition véhicule hybride/électrique ou vélo électrique.
•	Montant max. : 300 000 DHS
•	Durée max. : 84 mois
•	Avantages : taux préférentiel -1% + prime “mobilité durable”, assurance auto subventionnée 1ère année.
•	Conditions : devis ou facture pro forma obligatoire.
•	Banques partenaires : FINMOI, CFT, DMV
________________________________________
🔹 4. Prêt Mariage & Vie de Famille
•	Objet : financement des événements familiaux (mariage, naissance, aménagement maison).
•	Montant max. : 70 000 DHS
•	Durée max. : 72 mois
•	Avantages : 0 frais de dossier, taux réduit 1er mariage.
•	Conditions : justificatifs d’événement obligatoires.
•	Modalités spéciales : remboursement anticipé possible sans pénalité avant 24 mois.
•	Banques partenaires : CFT, DMV
________________________________________
🔹 5. Prêt Études Supérieures & Internationales
•	Objet : études universitaires au Maroc ou à l’étranger.
•	Montant max. : 150 000 DHS
•	Durée max. : 96 mois
•	Avantages : différé de remboursement jusqu’à 24 mois.
•	Conditions : inscription universitaire + justificatif frais obligatoire, garantie parentale si majeur et non salarié.
•	Banques partenaires : FINMOI, DMV
________________________________________
🔹 6. Prêt Logement Évolutif
•	Objet : acquisition, construction ou rénovation du logement principal.
•	Montant max. : 800 000 DHS
•	Durée max. : 180 mois
•	Avantages : subvention partielle des intérêts si zone prioritaire, taux bonifié primo-accédants.
•	Conditions : validation projet par banque partenaire, justificatif achat ou devis.
•	Garanties : hypothèque ou assurance obligatoire.
•	Banques partenaires : FINMOI, CFT, DMV
________________________________________
🔹 7. Prêt Coup de Pouce Urgence
•	Objet : imprévus (santé, réparations, voyages urgents).
•	Montant max. : 15 000 DHS
•	Durée max. : 24 mois
•	Avantages : déblocage rapide 48h, remboursement express possible en 12 mois.
•	Conditions : justificatif d’urgence obligatoire.
•	Banques partenaires : FINMOI
________________________________________
🔹 8. Prêts Complémentaires (Fidélité, Santé, Habitat Vert, Solidarité)
•	Prêt Fidélité : montant augmente avec ancienneté, taux réduit collaborateurs >10 ans, banques partenaires : FINMOI, CFT.
•	Prêt Santé & Bien-Être : financement soins médicaux lourds, montant max. 100 000 DHS, banques partenaires : FINMOI, DMV.
•	Prêt Habitat Vert : panneaux solaires, isolation, rénovation écologique, montant max. 200 000 DHS, banques partenaires : CFT, DMV.
•	Prêt Solidarité Familiale : aide pour soutenir un parent proche, montant max. 50 000 DHS, banques partenaires : FINMOI, DMV.
________________________________________
🔹 Modalités Générales
•	Éligibilité : minimum 6 mois d’ancienneté (12 mois pour prêt logement)
•	Taux d’intérêt : préférentiel selon type de prêt
•	Délais de traitement : 7-15 jours ouvrés (48h pour prêt urgence)
•	Assurances : décès-invalidité obligatoires >36 mois
•	Remboursement anticipé : autorisé sans pénalité après 12 mois
•	Suspension : possible en cas d’arrêt maladie >3 mois
•	Cumul des prêts : max 2 prêts simultanés (hors urgence), cumul max 1 000 000 DHS
•	Sanctions : retard >3 mois → suspension nouveaux prêts jusqu’à régularisation

🟦 Système des Dons aux Collaborateurs
Des dons pour vous et votre famille : un soutien à chaque étape de la vie professionnelle et personnelle.
________________________________________
🔹 1. Dons Fêtes & Traditions
•	Aid El Adha : Prime spéciale pour soutenir l’achat du mouton (montant adapté chaque année selon décision de l’entreprise).
•	Achoura :
o	800 DH par enfant de moins de 15 ans
o	Bon d’achat de 200 DH/enfant via l’Association de l’entreprise.
•	Aid Al Fitr : Prime symbolique pour marquer la fin du Ramadan.
•	Ramadan : Panier alimentaire ou bon d’achat équivalent (montant fixé chaque année).
•	Fête des mères & pères : Cadeau symbolique ou bon d’achat.
________________________________________
🔹 2. Dons Scolarité & Éducation
•	Soutien annuel à la scolarité :
o	1 500 DH : Enfants de moins de 3 ans (crèche/garderie)
o	1 800 DH : Maternelle
o	3 200 DH : Primaire
o	5 000 DH : Secondaire
o	8 000 DH : Supérieur
•	Prime Bac : 2 000 DH pour les enfants ayant obtenu leur baccalauréat avec mention.
•	Prime Diplôme Supérieur : 5 000 DH pour un enfant diplômé Licence/Master/Doctorat.
•	Prime Excellence : Bonus spécial (ex. 3 000 DH) pour enfants lauréats de concours nationaux/internationaux.
📌 Conditions : enfants jusqu’à 25 ans maximum, sur présentation d’attestation de scolarité.
________________________________________
🔹 3. Dons Vie Familiale & Événements Personnels
•	Naissance : 2 500 DH par enfant.
•	Mariage : 5 000 DH pour le collaborateur qui se marie.
•	Décès :
o	10 000 DH en cas de décès du collaborateur.
o	5 000 DH en cas de décès du conjoint ou d’un enfant.
o	2 500 DH en cas de décès d’un parent (père/mère).
•	Anniversaire d’ancienneté : prime symbolique tous les 10 ans de service.
________________________________________
🔹 4. Dons Santé & Bien-Être
•	Soutien médical exceptionnel : aide ponctuelle pour frais d’hospitalisation ou traitement lourd (dossier à présenter à la commission sociale).
•	Don handicap : allocation annuelle (ex. 3 000 DH) pour collaborateurs ou enfants en situation de handicap.
•	Cure & convalescence : participation partielle aux frais de repos médical recommandé.
________________________________________
🔹 5. Dons Mobilité & Habitat
•	Don logement : contribution exceptionnelle pour aider à l’acquisition d’un logement principal (lié aux prêts logement X3).
•	Don transport : aide forfaitaire pour les collaborateurs résidant à plus de 50 km du lieu de travail.
•	Don installation : prime pour accompagner une mutation géographique.
________________________________________
🔹 6. Dons Voyages Spirituels
•	Pèlerinage (Hajj) : 80 000 DH pour les collaborateurs âgés de 40 ans et plus.
•	Omra : 20 000 DH, accessible dès 35 ans, sur dossier.
________________________________________
🔹 7. Dons Loisirs, Culture & Sport
•	Don sport & culture : remboursement partiel (ex. 1 000 DH/an) des frais d’inscription des enfants dans des clubs sportifs ou culturels.
•	Don vacances : bons d’achat pour séjours touristiques en partenariat avec agences locales.
•	Don colonie de vacances : participation directe pour les enfants de collaborateurs (7 à 15 ans).
________________________________________
🔹 8. Dons Solidarité & Fidélité
•	Don fidélité : prime symbolique tous les 5 ans d’ancienneté.
•	Don solidarité exceptionnelle : aide en cas de catastrophe naturelle, sinistre ou difficulté majeure affectant un collaborateur.
•	Don collectif : fonds spécial alimenté par l’entreprise et les collaborateurs pour venir en aide aux familles dans le besoin.
________________________________________
🔹 9. Cas Particuliers
•	Don retraite : prime ou cadeau symbolique remis lors du départ en retraite.
•	Don distinction : pour collaborateurs honorés par une distinction externe (prix professionnel, médaille, etc.).
•	Don engagement social : participation symbolique pour ceux impliqués dans des initiatives caritatives soutenues par l’entreprise.


🌴 Système de Vacances Solidaires
Envie de vous évader ?
Profitez de 100 logements répartis sur 20 destinations à travers le Maroc :
•	Villes historiques : Marrakech, Fès, Essaouira, Meknès, Rabat, Tanger
•	Stations balnéaires : Agadir, Bouznika, M’diq, Martil, Oualidia, Sidi Ifni, Dakhla
•	Montagne et nature : Imlil, Ifrane, Ouarzazate, Merzouga, M’relft, Chefchaouen, Tétouan
Ces logements sont disponibles toute l’année à tarifs préférentiels pour les collaborateurs.
________________________________________
🔹 1. Modalités de Réservation
Basse Saison
•	Réservation en un clic via le SIRH.
•	Principe : “premier arrivé, premier servi”.
•	Préavis minimum : 15 jours avant la date souhaitée.
•	Durée maximale : 14 nuits consécutives (peut être étendue selon disponibilité et approbation RH).
•	Changement : autorisé jusqu’à 7 jours avant la date prévue.
Haute Saison
•	Attribution basée sur un système de points.
•	Réservation ouverte 3 mois à l’avance.
•	Annonce officielle : chaque période de haute saison est communiquée à tous les collaborateurs via un communiqué interne, précisant les dates et la durée.
•	Les points sont calculés selon : ancienneté, catégorie du poste, situation familiale, rotation et critères bonus.
•	La communication interne inclut également : calendrier de réservation, critères de points, et conditions spécifiques.

🔹 3. Critères d’Attribution en Haute Saison
Personnel concerné
•	Réservé au personnel en activité.
•	En cas de logements vacants : ouverture aux retraités ou collaborateurs non actifs, sur décision de la commission RH.

🔹 4. Modalités et règles additionnelles
•	Durée maximale par séjour : 14 nuits en basse saison, 10 nuits en haute saison.
•	Cumul de points : un seul logement par période de haute saison.
•	Annulation : remboursement intégral si respect du délai (7 jours basse saison, 30 jours haute saison), sinon frais 20%.
•	Priorité seniors : +1 point si collaborateur >55 ans.
•	Réservations exceptionnelles : commission RH peut ajuster l’attribution pour raisons professionnelles ou urgences familiales.
